<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spot</title>
    <meta name="description" content="???" />
    <meta name="Author" content="Michael D. Aviles" />
    <meta name="keywords" content="https://pawsnwhiskersworld.com/products/doel-65l-self-cleaning-cat-litter-box-app-control???" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./pages/index.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spots logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="Coleman picture"
            class="profile__avatar"
          />
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
             <p class="profile__description">Civil Aviator</p>
             <button type="button" class="profile__edit-btn">
          <img src="./images/pencil.svg" alt="pencil icon" class="profile__pencil">Edit Profile
        </button>
          </div>
        <button class="profile__new-post-btn" type="button">
          <img src="./images/plus.svg" class="profile__plus" alt="plus icon">New Post
        </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                 <button type="button" arial-label="Delete card" class="card__delete-btn"></button>
              <img
              class= card__image src="#" alt=""/>
              <div class="card__footer">
                <h2 class="card__title"></h2>
                <button type="button" aria-label="Like card" class="card__like-btn"></button>
              </div>
            </li>
            </template>
      </ul>
        </section>
      </main>
      <footer class="footer page__section">
        <p class="footer__text">2023 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
  <span class="visually-hidden">Close</span>
</button>
          <h2 class="modal__title">Edit profile</h2>
          <form class="modal__form">
          <label for="profile-name-input" class="modal__label">
            Name
            <input  id="profile-name-input" type="text" class="modal__input" placeholder="Type your name">
          </label>
          <label for="profile-description-input" class="modal__label">
            Description
            <input  id="profile-description-input" type="text" class="modal__input" placeholder="Describe yourself">
          </label>
          <button type="submit" class=modal__ button modal__submit-btn">Save</button>

          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button" class="modal__close-btn">
  <span class="visually-hidden">Close</span>
</button>
          <h2 class="modal__title">New post</h2>
          <form class="modal__form">
          <label for="card-image-input" class="modal__label">
            Image link
            <input  id="card-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture">
          </label>
          <label for="card-caption-input" class="modal__label">
            Caption
            <input  id="card-caption-input" type="text" class="modal__input" placeholder="Type your caption">
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>

          </form>
       </div>
      </div>
<div class="modal modal_type_preview" id="preview-modal">
        <div class="modal__image-container">
          <button type="button" class="modal__ close modal__close-btn modal__close_type_preview">
</button>
     <img src="#" alt="" class="modal__image">
          <p class="modal__caption"></p>

       </div>
      </div>


    <script src="./scripts/index.js"></script>
  </body>
</html>
